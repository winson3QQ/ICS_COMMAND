name: Issue / PR Snapshot

# 將 GitHub issue/PR 結構化匯出為 JSON 並推到 Codeberg（C 方案 SoT disaster fallback）
# 設計見 scripts/snapshot_issues.sh header 與 docs/backups/README.md

on:
  push:
    branches: [main]
    paths:
      - 'scripts/snapshot_issues.sh'
      - '.github/workflows/issue-snapshot.yml'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]
  # SECURITY 2026-05-26：移除 pull_request / pull_request_review_comment triggers。
  # 原設計讓 PR 事件觸發 snapshot，但配合 `git push origin HEAD:main` 會把 PR HEAD
  # 強行 fast-forward 進 main，繞過 PR review/squash（PR #18 實際中招過一次）。
  # snapshot 純為 metadata 備份，issues + cron + main push 已涵蓋；PR 的 metadata
  # 由 PR merge 後 main push 自然帶到。
  schedule:
    - cron: '0 0 * * *'   # 兜底：每日 00:00 UTC
  workflow_dispatch: {}    # 手動觸發按鈕

# 同時只跑一份，避免 race；不取消舊的（保證每個事件都有機會 catch up）
concurrency:
  group: issue-snapshot
  cancel-in-progress: false

permissions:
  contents: write   # 需要 commit + push 回 repo
  issues: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main          # SECURITY：強制 main，即使被 PR event 觸發也不取 PR HEAD
          fetch-depth: 0     # Codeberg 同步需完整歷史

      - name: 跑 snapshot script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/snapshot_issues.sh

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backups/
          if git diff --staged --quiet; then
            echo "No changes; skipping commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(backup): issue/PR snapshot $(date -u +%Y-%m-%dT%H:%MZ)

          Trigger: ${{ github.event_name }}
          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push to GitHub (origin)
        if: steps.commit.outputs.committed == 'true'
        # checkout step 已 ref:main，HEAD 必為 main + snapshot commit。
        # 但仍 explicit 寫 main:main 雙重防禦：任何 future 改動意外讓 HEAD
        # 變成 PR ref 都不會 fast-forward 進 main。
        run: git push origin main:main

      - name: Push to Codeberg
        if: steps.commit.outputs.committed == 'true'
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "${CODEBERG_TOKEN}" ]; then
            echo "::warning::CODEBERG_TOKEN 未設定，跳過 Codeberg push（snapshot 已推到 GitHub）"
            exit 0
          fi
          git remote add codeberg \
            "https://winson3QQ:${CODEBERG_TOKEN}@codeberg.org/winson3QQ/ICS_COMMAND.git"
          git push codeberg main:main
