# deploy/prod/docker-compose.yml — ICS_Command 單機 delivery 棧（ICS + 可選 TAK）
#
# 「相同佈署、不同 delivery」(商用化考量)：同一份 compose，用 profile + .env toggle 切交付形態。
#   純 ICS delivery:    docker compose --env-file .env up -d
#   ICS + TAK delivery: docker compose --env-file .env --profile tak up -d   （.env 設 TAK_ENABLED=true）
#   dev 單機全上:        同上（--profile tak）
#
# 全服務同一張 icsnet → TAK on 時 ics-command 以容器名 takserver:8089 / :8443 直連（內網，不經公網 IP）。
# 對外（單一公網 IP 多 port）：443→nginx(ICS mTLS)、8089/8446→takserver（現場 ATAK）；8443 admin 不轉發。
#
# 前置 1（build）：#300 OneDrive reparse 殘渣已解，Desktop 現可直接 build。僅當 repo 再被 OneDrive
#                  同步污染才會 invalid file request → 屆時見 deploy/build-env.md（移非同步路徑或重 clone）。
# ⚠ 前置 2（TAK release）：tak-server 需官方包解壓到 ../tak-server/release/（見 deploy/tak-server/README）。
# ⚠ 前置 3（憑證）：step-ca 簽 nginx server cert 由 ca-bootstrap 自動；TAK server cert + ICS→TAK client
#                    cert 需先跑 ../tak-server/pki/issue-tak-certs.sh，產物放 ./tak-certs/（見 README）。
name: ics-prod

services:
  # ── ICS 核心（永遠在；複用 ../ics-validation/mtls 的 bootstrap/nginx 腳本）──────────
  step-ca:
    image: smallstep/step-ca:latest        # TODO 正式版釘 digest（供應鏈）
    restart: unless-stopped
    environment:
      - DOCKER_STEPCA_INIT_NAME=ICS mTLS CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,localhost
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=ics
      - DOCKER_STEPCA_INIT_PASSWORD=${STEP_CA_PASSWORD:?STEP_CA_PASSWORD 必須設定（見 .env.example）}
      # #279：CA 憑證效期（fresh deploy 自動套 90 天，免手動 patch provisioner claims）。
      - ICS_CA_MAX_CERT_DURATION=${ICS_CA_MAX_CERT_DURATION:-2160h}
    volumes:
      - ca-data:/home/step
      - ../ics-validation/mtls/step-ca-claims-wrap.sh:/step-ca-claims-wrap.sh:ro
    # #279：official entrypoint 先 init（fresh）再 exec 本 CMD → wrapper 在 daemon 啟動前把
    # authority.claims 設成 90 天（覆蓋 fresh init 的 24h 預設），再 exec 真正 daemon。reproducible。
    command: ["sh", "/step-ca-claims-wrap.sh", "/usr/local/bin/step-ca", "--password-file", "/home/step/secrets/password", "/home/step/config/ca.json"]
    networks: [icsnet]

  ca-bootstrap:
    image: smallstep/step-cli:latest
    user: root
    depends_on:
      step-ca:
        condition: service_healthy
    environment:
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_PROVISIONER=ics
      - STEP_CA_PASSWORD=${STEP_CA_PASSWORD:?STEP_CA_PASSWORD 必須設定}
      - ICS_SERVER_SANS=${ICS_SERVER_SANS:-}   # 公網 IP/網域寫進 nginx server cert SAN（空白分隔）
      - ICS_SERVER_SANS_ALLOW_PRIVATE=${ICS_SERVER_SANS_ALLOW_PRIVATE:-false}   # #321 L9：預設過濾 RFC1918 內網 IP（防公網 cert 洩拓樸）；純 LAN/dev 才設 true
      - ICS_SERVER_CERT_DURATION=${ICS_SERVER_CERT_DURATION:-2160h}   # nginx server cert 效期；#279 wrapper 已把 provisioner claims 放寬 90 天 → 預設可直接 2160h（fresh deploy 不再被拒）
    volumes:
      - ca-data:/ca:ro
      - pki:/pki
      - ca-share:/share
      - ../ics-validation/mtls/ca-bootstrap.sh:/ca-bootstrap.sh:ro
    entrypoint: ["sh", "/ca-bootstrap.sh"]
    networks: [icsnet]
    restart: "no"

  ics-command:
    image: ics-command:dev                  # build：見 deploy/build-env.md（OneDrive 前置）
    restart: unless-stopped
    depends_on:
      ca-bootstrap:
        condition: service_completed_successfully
    environment:
      - ICS_ENV=prod
      - ICS_MTLS_REQUIRED=${ICS_MTLS_REQUIRED:-true}
      - ICS_BEHIND_PROXY=true
      # #345 session 生命週期：idle 逾時 1h。原 scaffold 預設 86400（24h）使
      # cleanup cutoff=min(IDLE,SESSION)=min(24h,14h)=14h → 被丟棄 session 硬撐滿 14h 才清，
      # 半夜成串 SESSION_EXPIRED（看似入侵的延遲回聲）+ 稽核噪音。降至 3600 後閒置 1h 即清，
      # 兼顧演習現場指揮短暫離開 dashboard 不被太早登出。check_session 與批次清理同軸 min()。
      - ICS_IDLE_TIMEOUT_SECONDS=3600
      # #343 紅藍 faction 隔離濾鏡（預設 off「零風險漸進啟用」；演習要紅藍隔離時設 .env=true）。
      # on 時 commander/operator/observer 只見 blue+neutral 的 tak 物件、faction=None 亦藏（fail-closed）；sysadmin 全見。
      - ICS_FACTION_ISOLATION=${ICS_FACTION_ISOLATION:-false}
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_PROVISIONER=ics
      - STEP_CA_PROVISIONER_PASSWORD_FILE=/ca-share/prov.pass
      - STEP_CA_FINGERPRINT_FILE=/ca-share/fingerprint
      - STEP_CLIENT_CERT_DURATION=${STEP_CLIENT_CERT_DURATION:-2160h}   # 線上發證 client cert 效期。#279：step-ca-claims-wrap 已把 provisioner claims reproducible 放寬 90 天（fresh deploy 自動），故預設直接 2160h。
      - ICS_PROXY_SHARED_SECRET=${ICS_PROXY_SHARED_SECRET:?ICS_PROXY_SHARED_SECRET 必須設定（見 .env.example）}
      # ── TAK 整合（toggle；純 ICS delivery 下全空、TAK_ENABLED=false）──────────────
      - TAK_ENABLED=${TAK_ENABLED:-false}
      - TAK_COT_URL=${TAK_COT_URL:-}              # tls://takserver:8089（容器內網）
      - TAK_DEVICE_CONNECT_HOST=${TAK_DEVICE_CONNECT_HOST:-}  # #315 對外 TAK 位址（裝置 data package connectString，非容器內網名）
      - TAK_DEVICE_CONNECT_PORT=${TAK_DEVICE_CONNECT_PORT:-8089}
      - TAK_DEVICE_CA_DIR=${TAK_DEVICE_CA_DIR:-}  # #315 TAK 裝置 CA dir（含 tak-ca.pem/key；TAK 只信此 CA，非 step-ca）。如 /tak-certs/_ca
      - TAK_CLIENT_CERT=${TAK_CLIENT_CERT:-}      # /tak-certs/...（step-ca 簽，fullchain）
      - TAK_CLIENT_KEY=${TAK_CLIENT_KEY:-}
      - TAK_CAFILE=${TAK_CAFILE:-}                # step-ca root，驗 TAK server cert
      - TAK_MARTI_URL=${TAK_MARTI_URL:-}          # https://takserver:8443
      - TAK_MARTI_READ_CERT=${TAK_MARTI_READ_CERT:-}
      - TAK_MARTI_READ_KEY=${TAK_MARTI_READ_KEY:-}
      - TAK_MARTI_WRITE_CERT=${TAK_MARTI_WRITE_CERT:-}
      - TAK_MARTI_WRITE_KEY=${TAK_MARTI_WRITE_KEY:-}
      - TAK_MARTI_ADMIN_CERT=${TAK_MARTI_ADMIN_CERT:-}   # #344/#357 管理級 cert（ROLE_ADMIN）→ user-management group API；空則 faction 不同步 TAK group
      - TAK_MARTI_ADMIN_KEY=${TAK_MARTI_ADMIN_KEY:-}
      # #344 enrollment：發證即註冊 managed user（經 tak-registrar 跑 usermod）。queue dir = 與 registrar 共享卷。
      - TAK_ENROLL_QUEUE_DIR=${TAK_ENROLL_QUEUE_DIR:-/registrar-queue}
      - TAK_ENROLL_DEFAULT_GROUP=${TAK_ENROLL_DEFAULT_GROUP:-neutral}   # 初始群（fail-closed）
      - TAK_ENROLL_TIMEOUT_S=${TAK_ENROLL_TIMEOUT_S:-8}
      # #318 層2 真撤銷：ICS 直連 TAK postgres 寫 certificate 表（hash+revocation_date）→ x509checkRevocation
      # 在 :8089 連線層擋撤銷證。空 TAK_DB_HOST/PASSWORD → revoke 僅 ICS 帳面，不寫 TAK（未真 enforce）。
      - TAK_DB_HOST=${TAK_DB_HOST:-}              # 如 tak-database（同 icsnet）
      - TAK_DB_PORT=${TAK_DB_PORT:-5432}
      - TAK_DB_NAME=${TAK_DB_NAME:-cot}
      - TAK_DB_USER=${TAK_DB_USER:-martiuser}
      - TAK_DB_PASSWORD=${TAK_DB_PASSWORD:-}     # ⚠ 汰 dev takdevpass123（threat_model §8.4 at-rest）
    volumes:
      - ics-data:/app/data
      - ics-tiles:/app/static/tiles:ro
      - ca-share:/ca-share:ro
      - ./tak-certs:/tak-certs:ro             # ICS→TAK client/marti 憑證（issue-tak-certs.sh 產）
      - tak-registrar-queue:/registrar-queue  # #344 與 tak-registrar 共享的 enrollment 請求/結果佇列
    networks: [icsnet]
    # 不對 host publish；只經 nginx（+ X-Proxy-Auth 共享密鑰）

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      ca-bootstrap:
        condition: service_completed_successfully
      ics-command:
        condition: service_started
    ports:
      - "443:443"                            # ICS 儀表板對外（mTLS）
    environment:
      - ICS_PROXY_SHARED_SECRET=${ICS_PROXY_SHARED_SECRET:?ICS_PROXY_SHARED_SECRET 必須設定}
      - NGINX_ENVSUBST_FILTER=ICS_PROXY_SHARED_SECRET
    volumes:
      - ../ics-validation/mtls/nginx.mtls.conf:/etc/nginx/templates/default.conf.template:ro
      - pki:/pki:ro
    networks: [icsnet]

  # 按需發 per-device client 憑證：docker compose run --rm -e CERT_CN=commander-phone-01 issue-client
  issue-client:
    image: smallstep/step-cli:latest
    user: root
    profiles: ["tools"]
    depends_on:
      ca-bootstrap:
        condition: service_completed_successfully
    environment:
      - CERT_CN=${CERT_CN:-}
      - STEP_CA_URL=https://step-ca:9000
      - STEP_CA_PROVISIONER=ics
      - ICS_CLIENT_P12_PASS=${ICS_CLIENT_P12_PASS:?ICS_CLIENT_P12_PASS 必須設定}
    volumes:
      - ca-share:/share:ro
      - ./out:/out
      - ../ics-validation/mtls/issue-client.sh:/issue-client.sh:ro
    entrypoint: ["sh", "/issue-client.sh"]
    networks: [icsnet]

  # ── TAK（profiles: ["tak"]；純 ICS delivery 不啟用）──────────────────────────────
  tak-database:
    profiles: ["tak"]
    build:
      context: ../tak-server/release
      dockerfile: docker/Dockerfile.takserver-db
    image: ics-takserver-db:5.7
    container_name: tak-database
    hostname: tak-database                  # CoreConfig 綁 jdbc://tak-database，勿改
    restart: unless-stopped
    shm_size: "512m"
    entrypoint: ["/bin/bash", "-c", "chown -R postgres:postgres /var/lib/postgresql/15 && exec /opt/tak/db-utils/configureInDocker.sh"]
    volumes:
      - ../tak-server/release/tak:/opt/tak
      - tak-db-data:/var/lib/postgresql/15/data
    networks: [icsnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U martiuser -d cot || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  takserver:
    profiles: ["tak"]
    build:
      context: ../tak-server/release
      dockerfile: docker/Dockerfile.takserver
    image: ics-takserver:5.7
    container_name: takserver
    hostname: takserver                     # ics-command 以此名連 :8089 / :8443
    restart: unless-stopped
    depends_on:
      tak-database:
        condition: service_healthy
    env_file: ../tak-server/.env            # TAK server 自身設定（見 deploy/tak-server/README）
    volumes:
      - ../tak-server/release/tak:/opt/tak
    ports:
      - "${TAK_STREAMING_PORT:-8089}:8089"   # CoT 串流（現場 ATAK；對外轉發）
      - "${TAK_CERTENROLL_PORT:-8446}:8446"  # 憑證註冊（managed cert 才需；對外轉發）
      # 8443 admin web：刻意不對外（留內網/本機管理，減攻擊面）。需要時自行加：
      # - "${TAK_WEBUI_PORT:-8443}:8443"
    networks: [icsnet]

  # ── #344 TAK 裝置 enrollment registrar ───────────────────────────────────────────
  # ics-command 發證後把裝置證 fingerprint 註冊成 TAK managed user + 初始群（usermod）。
  # 為何獨立 sidecar 且 network_mode 綁 takserver：usermod/certmod 是 server-coupled（連 takserver
  # **本機 IPC** 熱套用）——ICS（獨立 netns、無 Java）跑會 timeout、裸寫 auth 檔不被認（2026-06-23 PoC
  # 實證，#344）。共享 takserver network namespace → usermod 連得到 localhost server，**免 docker socket**。
  # reuse ics-takserver image（含 Java + UserManager.jar）；掛同一份 /opt/tak；經共享卷檔佇列收 ICS 請求。
  tak-registrar:
    profiles: ["tak"]
    image: ics-takserver:5.7
    restart: unless-stopped
    depends_on:
      takserver:
        condition: service_started
    network_mode: "service:takserver"        # ← 關鍵：共享 takserver netns（不可同時設 networks）
    entrypoint: ["/bin/bash", "/registrar/registrar.sh"]
    volumes:
      - ../tak-server/release/tak:/opt/tak                              # 同一份 payload（UserManager.jar）
      - ../tak-server/registrar/registrar.sh:/registrar/registrar.sh:ro
      - tak-registrar-queue:/registrar-queue                           # 與 ics-command 共享的請求/結果佇列

volumes:
  pki:
  ca-data:
  ca-share:
  tak-db-data:
  tak-registrar-queue:                       # #344 ics-command ↔ tak-registrar enrollment 佇列
  ics-data:
    external: true                          # 沿用既有 ics-data（runtime 資料；勿隨棧刪）
  ics-tiles:
    external: true                          # provisioned 底圖（taiwan.pmtiles）

networks:
  icsnet:
