# deploy/perimeter/wg-monitor/test-stack/docker-compose.yml — #447 自帶整合測試棧
#
# 真 WireGuard：server + 兩個「同 key」client（cloned-key）→ server endpoint 在兩來源間擺盪 →
# wg-monitor（共享 server netns）在**真 wg show** 上偵測到 endpoint_oscillation/critical。
# 完全獨立、不碰 prod/ICS/TAK。跑法見 run.sh；清理 `docker compose down -v`。
name: wgtest

services:
  keygen:
    build:
      context: .
      dockerfile: Dockerfile.wgnode
    image: wgtest-node:dev
    environment: [ROLE=keygen]
    volumes: [shared:/shared]
    restart: "no"

  server:
    image: wgtest-node:dev
    container_name: wgtest-server          # 供 wg-monitor 以 network_mode:container 接入
    depends_on:
      keygen: {condition: service_completed_successfully}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment: [ROLE=server]
    volumes: [shared:/shared]
    restart: unless-stopped

  client-a:
    image: wgtest-node:dev
    depends_on:
      server: {condition: service_started}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment: [ROLE=client, SERVER_HOST=wgtest-server]
    volumes: [shared:/shared]
    restart: unless-stopped

  client-b:
    image: wgtest-node:dev
    depends_on:
      server: {condition: service_started}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment: [ROLE=client, SERVER_HOST=wgtest-server]
    volumes: [shared:/shared]
    restart: unless-stopped

  wg-monitor:
    build:
      context: ..                          # 父目錄 = 監測本體（Dockerfile + src/）
      dockerfile: Dockerfile
    image: ics-wg-monitor:dev
    depends_on:
      server: {condition: service_started}
      ntfy: {condition: service_started}
    network_mode: "container:wgtest-server"  # 共享 server netns → 讀其 wg0（也能解析同網段的 ntfy）
    cap_add: [NET_ADMIN]
    environment:
      - WGMON_IFACE=wg0
      - WGMON_POLL_S=5                     # 測試加速：5s 輪詢，抓得到擺盪
      - WGMON_OSC_WINDOW_S=120
      - WGMON_OFFLINE_AFTER_S=60
      - WGMON_COOLDOWN_S=30
      - WGMON_DB=/data/wg-monitor.db
      - WGMON_NTFY_URL=http://ntfy/wg-alerts   # 推到自架 ntfy（驗手機推播鏈路）
    volumes: [mondata:/data]
    restart: unless-stopped

  # 自架 ntfy（驗「監測 → ntfy → 手機」整條鏈）。手機在 ntfy app 訂閱
  # http://<本機LAN-IP>:8080/wg-alerts 即可在觸發時收到推播。
  ntfy:
    image: binwiederhier/ntfy:v2.11.0      # 上游官方（德國作者 Philipp Heckel，Apache-2.0，無中國成分）
    container_name: wgtest-ntfy
    command: ["serve"]
    environment:
      - NTFY_BASE_URL=http://localhost:8080
      - NTFY_LISTEN_HTTP=:80
    ports:
      - "8080:80"                          # 手機/瀏覽器訂閱用
    restart: unless-stopped

volumes:
  shared:
  mondata:
