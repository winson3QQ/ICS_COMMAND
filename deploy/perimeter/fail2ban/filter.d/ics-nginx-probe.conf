# filter.d/ics-nginx-probe.conf — #280 C：辨識掃描/探測請求（給 fail2ban 比對 ban）
#
# 比對 ICS nginx access log（log_format ics_mtls，見 nginx.mtls.conf）。命中：
#   - 無 client 憑證的請求（verify=NONE / status 400）= 掃描者或亂打的
#   - 明顯探測路徑（.env/.git/.php/wp-…）
# <HOST> = 來源 IP（⚠ 需 nginx 看到真實 IP 才有意義，見 deploy/perimeter/README）
[Definition]
failregex = ^<HOST> \[.*\] ".*" 400 .*verify=(NONE|FAILED)
            ^<HOST> \[.*\] "(GET|POST|HEAD|PROPFIND) [^"]*(?:\.env|\.git|\.aws|\.ssh|wp-login|wp-admin|\.php|ecosystem\.config|/vendor/)[^"]*" \d+
ignoreregex =
