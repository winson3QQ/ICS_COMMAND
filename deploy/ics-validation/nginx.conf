# nginx.conf — ICS cmd dashboard 對外 TLS 反代（驗證用）
# 443 TLS 終結 → 容器內 ics-command:8000。只露這一個入口，host 其他服務不對外。
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # #289 H4：明確 cipher 套件 + server 端偏好（非 prod 快測版亦對齊，縱深）。
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # #289 H4：安全標頭基線（後端只發 CSP，其餘委派 nginx；location 未自帶 add_header 故繼承）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # 驗證機自簽憑證，瀏覽器會跳「不受信任」警告，點繼續即可。

    # ── #275 全角色 mTLS（單埠 443 強制）啟用區塊 ──────────────────────
    # Wave 3（PKI）簽出 per-user/裝置 client cert + root CA truststore 後解註：
    #   ssl_client_certificate /etc/nginx/certs/root_ca.crt;  # 信任的簽發 CA
    #   ssl_verify_client      on;      # 無有效 client cert → 網路層即擋（無角色裸曝）
    #   ssl_verify_depth       2;
    # 並把下方 location 的 X-Client-Cert-* 改為從 $ssl_client_* 注入（見該處註解）。
    # 啟用前提：所有 client 已安裝 step-ca 簽的 client cert，否則全員連不進。
    # ────────────────────────────────────────────────────────────────

    location / {
        proxy_pass         http://ics-command:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # #275 wave 2: edge 無上游 LB，用 $remote_addr 覆寫（不可用 nginx 的
        # proxy_add 變體，它會 append client 偽造的 XFF；對齊 deploy/nginx P1-09 修正）。
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # #275 wave 2 trusted-header 剝除（紅線）：非 mTLS 時剝除 client 自帶
        # X-Client-Cert-* 防偽造後端 AAL2 第二因子。
        # mTLS 啟用後改為（CN 須經 map 從 $ssl_client_s_dn 抽，stock nginx 無單欄位 CN 變數）：
        #   map $ssl_client_s_dn $ics_client_cn { default ""; ~CN=(?<cn>[^,]+) $cn; }  # http context
        #   proxy_set_header X-Client-Cert-CN     $ics_client_cn;
        #   proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        proxy_set_header   X-Client-Cert-CN     "";
        proxy_set_header   X-Client-Cert-Verify "";
        # WebSocket（COP 即時推送）支援
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
