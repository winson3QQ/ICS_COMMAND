# nginx.mtls.conf — #275 wave A：全角色 mTLS 強制（443 單埠）驗證棧
# 443 TLS + mTLS 終結 → 容器內 ics-command:8000。無有效 client cert 連不進（網路層即擋）。
# 憑證由 pki-init（step-ca）簽，掛在 /pki（root+intermediate truststore = ca-bundle.crt）。

# client 憑證 CN 抽取：stock nginx 無單欄位 CN 變數（$ssl_client_s_dn_cn 會 emerg，
# 2026-06-20 Docker 實證），只有 $ssl_client_s_dn（RFC2253 全 DN）。以 map regex 抽 CN。
map $ssl_client_s_dn $ics_client_cn {
    default "";
    ~CN=(?<cn>[^,]+) $cn;
}

# #280 周邊硬化：access log 補 client 憑證驗證結果（餵 fail2ban / 監控）。
# 注意：Docker port-publish 下 $remote_addr = bridge gateway（非真實外網 IP），見
# deploy/perimeter/README——per-IP 監控/封鎖須先還原真實 IP（Tailscale 前置 / host net）。
log_format ics_mtls '$remote_addr [$time_local] "$request" $status '
                    'verify=$ssl_client_verify cn="$ics_client_cn" '
                    'ua="$http_user_agent"';

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log ics_mtls;

    # #280：明顯掃描/探測路徑直接 444 drop（無證者已被 mTLS 400 擋在前；此為縱深）
    location ~* "(?:\.env|\.git|\.aws|\.ssh|wp-login|wp-admin|\.php|ecosystem\.config|/vendor/|/\.vscode)" {
        return 444;
    }

    ssl_certificate     /pki/server.crt;
    ssl_certificate_key /pki/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── mTLS 核心 ──────────────────────────────────────────────
    ssl_client_certificate /pki/ca-bundle.crt;   # 信任的簽發 CA（root + intermediate）
    ssl_verify_client      on;                    # 無有效 client cert → 400（網路層擋）
    ssl_verify_depth       2;

    location / {
        proxy_pass         http://ics-command:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # trusted-header：注入 nginx 驗證結果（覆寫 client 自帶 = 剝除偽造）
        proxy_set_header   X-Client-Cert-CN     $ics_client_cn;
        proxy_set_header   X-Client-Cert-Verify $ssl_client_verify;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
