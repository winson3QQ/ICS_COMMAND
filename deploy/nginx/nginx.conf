# nginx.conf — Mac 開發機用主設定
#
# Prod（C3-B 客戶部署）會用 /etc/nginx/nginx.conf + /etc/nginx/conf.d/，
# 此檔僅 dev 用，由 deploy/nginx/start-dev.sh 載入（-c 參數）。

worker_processes auto;
error_log /tmp/ics-nginx-error.log warn;
pid /tmp/ics-nginx.pid;

events {
    worker_connections 1024;
}

http {
    # MIME types（macOS Homebrew 預設路徑）
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log 格式（含 X-Forwarded-For，反代後仍見原始 IP）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /tmp/ics-nginx-access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # WebSocket upgrade map：只在 client 送 Upgrade header 時對 upstream 升級
    # 沒此 map 用「Connection: upgrade」寫死會殺光 upstream keepalive pool
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip（API JSON 回應壓縮）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 載入 server block
    include conf.d/command.conf;
    # command-mtls.conf.disabled（#275 全角色 mTLS 單埠 443 強制版）故意不 include：
    # 與 command.conf 同 listen 443 不可並存，mTLS 佈署時改用 setup.sh ICS_MTLS=1
    # 安裝（移除 command.conf、裝 command-mtls.conf），dev 預設走非 mTLS command.conf。
}
