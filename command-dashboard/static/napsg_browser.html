<!DOCTYPE html>
<html lang="zh-Hant">
<!--
  NAPSG 符號庫瀏覽器 — 設計參考工具（非 app 流程，與 icon_preview.html 同類）
  資料來源：NAPSG Foundation 官方符號庫 https://napsg-web.s3.amazonaws.com/symbology/
           （US DHS / FEMA-aligned，CC BY 4.0；全鏈非中國，符合 CLAUDE.md 供應鏈規則）
  資料檔：napsg_gallery.json（由 napsg-web S3 bucket data/PNG/ 列舉去重而來，每符號留代表尺寸）
  ⚠ 線上引用版：符號圖以 <img> 直連 S3，需連網。離線（air-gap）需求時再做下載鏡像版。
  用途：瀏覽 NAPSG 完整符號集，作為事件符號（P1-10d / #66）與未來 TAK/2525 對照的設計參考。
-->
<head>
<meta charset="utf-8">
<title>NAPSG 符號庫瀏覽器（純 NAPSG）</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#c9d1d9;--dim:#8b949e;--accent:#FF8918;--card:#eef2f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  header .meta{color:var(--dim);font-size:12px}
  header .meta b{color:var(--accent)}
  #q{margin-left:auto;background:#0d1117;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 11px;font-size:13px;width:280px}
  .wrap{display:flex;flex:1;min-height:0}
  nav{width:230px;border-right:1px solid var(--line);overflow:auto;padding:8px 0;flex-shrink:0}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:9px 18px;font-size:13px;cursor:pointer;border-left:3px solid transparent}
  nav button:hover{background:var(--panel)}
  nav button.active{background:var(--panel);border-left-color:var(--accent);color:#fff}
  nav button span{color:var(--dim);font-size:11px;font-family:"JetBrains Mono",monospace;float:right}
  main{flex:1;overflow:auto;padding:16px 20px}
  h2{font-size:14px;color:var(--accent);margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  h2:first-child{margin-top:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
  .sym{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
  .sym .tile{background:var(--card);border-radius:6px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sym img{max-width:62px;max-height:62px;display:block}
  .sym .nm{font-size:10.5px;color:var(--dim);line-height:1.3;word-break:break-word}
  .count{color:var(--dim);font-size:12px;margin:0 0 12px}
  .empty{color:var(--dim);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>NAPSG 符號庫瀏覽器</h1>
  <div class="meta">純 NAPSG（US DHS/FEMA · <b>CC BY 4.0</b>）｜<b id="uniq">…</b> 個符號 / <b id="tot">…</b> PNG（含尺寸變體）｜線上引用版（需連網）</div>
  <input id="q" type="search" placeholder="搜尋符號名稱（英文）…">
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><div class="empty">載入中…</div></main>
</div>
<script>
let DATA=null, CUR=null;
const $=s=>document.querySelector(s);

function tile(item){
  const url = DATA.base + item.k;
  const nm = item.n.replace(/_/g,' ');
  return `<div class="sym"><div class="tile"><img loading="lazy" src="${url}" alt="${nm}" title="${item.n}"></div><div class="nm">${nm}</div></div>`;
}

function renderCategory(cat){
  CUR=cat;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  const subs = DATA.tree[cat];
  let total=0, html='';
  for(const [sub,items] of Object.entries(subs)){
    total+=items.length;
    html += `<h2>${sub.replace(/_/g,' ')} <span style="color:var(--dim);font-weight:400">(${items.length})</span></h2>`;
    html += `<div class="grid">${items.map(tile).join('')}</div>`;
  }
  $('#main').innerHTML = `<p class="count">${cat.replace(/_/g,' ')}：${total} 個符號</p>` + html;
  $('#main').scrollTop=0;
}

function renderSearch(term){
  term=term.toLowerCase();
  const hits=[];
  for(const [cat,subs] of Object.entries(DATA.tree))
    for(const [sub,items] of Object.entries(subs))
      for(const it of items)
        if(it.n.toLowerCase().includes(term)) hits.push({cat,sub,it});
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  if(!hits.length){ $('#main').innerHTML=`<div class="empty">找不到「${term}」</div>`; return; }
  $('#main').innerHTML = `<p class="count">搜尋「${term}」：${hits.length} 個符號</p><div class="grid">`
    + hits.slice(0,600).map(h=>tile(h.it)).join('') + `</div>`
    + (hits.length>600?`<p class="count">（只顯示前 600 個，請縮小關鍵字）</p>`:'');
  $('#main').scrollTop=0;
}

fetch('napsg_gallery.json').then(r=>r.json()).then(d=>{
  DATA=d;
  $('#uniq').textContent=d.unique; $('#tot').textContent=d.total_png;
  const nav=$('#nav');
  nav.innerHTML=Object.entries(d.tree).map(([cat,subs])=>{
    const n=Object.values(subs).reduce((a,v)=>a+v.length,0);
    return `<button data-cat="${cat}">${cat.replace(/_/g,' ')}<span>${n}</span></button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#q').value='';renderCategory(b.dataset.cat);});
  renderCategory(Object.keys(d.tree)[0]);
}).catch(e=>{ $('#main').innerHTML=`<div class="empty">載入失敗：${e}</div>`; });

let t; $('#q').addEventListener('input',e=>{
  clearTimeout(t); const v=e.target.value.trim();
  t=setTimeout(()=>{ v? renderSearch(v) : renderCategory(CUR||Object.keys(DATA.tree)[0]); },220);
});
</script>
</body>
</html>
